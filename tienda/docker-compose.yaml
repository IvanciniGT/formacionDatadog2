# Demo stack for the Datadog course. See ../README.md for how to use it.
# All DD_* values come from .env (copy .env.example).

services:

  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: datadog-agent
    pid: host            # process collection and container<->process mapping
    cgroup: host         # cgroup v2 hosts: the agent needs the host cgroup namespace
    environment:
      DD_API_KEY: ${DD_API_KEY}
      DD_SITE: ${DD_SITE:-datadoghq.eu}
      DD_ENV: ${DD_ENV:-course}
      DD_HOSTNAME: course-laptop
      DD_TAGS: "team:training course:datadog"
      # --- APM: receive traces from shop-api (port 8126) ---
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      # --- DogStatsD: receive custom metrics from shop-api (port 8125) ---
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      # --- Logs: all containers' stdout/stderr ---
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      # --- Live processes ---
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
      # --- Container metadata as tags (service/env/version from the containers' labels) ---
      DD_CONTAINER_LABELS_AS_TAGS: '{"com.docker.compose.service":"compose_service"}'
      # container_collect_all picks up EVERY container on this Docker host: exclude the agent itself
      # and anything that is not part of the demo (add names here if your laptop runs other containers)
      DD_CONTAINER_EXCLUDE_LOGS: "name:datadog-agent name:mi-nginx-2"
      DD_CONTAINER_EXCLUDE_METRICS: "name:mi-nginx-2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./agent/conf.d/postgres.d:/etc/datadog-agent/conf.d/postgres.d:ro
    ports:
      - "8125:8125/udp"   # so you can also send DogStatsD from the host in lab03
      - "8126:8126"       # and traces from an app started on the host
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    labels:
      com.datadoghq.tags.service: shop-db
      com.datadoghq.tags.env: ${DD_ENV:-course}
      com.datadoghq.ad.logs: '[{"source":"postgresql","service":"shop-db"}]'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  shop-api:
    build: ./app
    image: shop-api:${DD_VERSION:-1.0.0}
    container_name: shop-api
    environment:
      DB_HOST: postgres
      DB_NAME: shop
      DB_USER: shop
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shop}
      # --- Unified Service Tagging: the three tags that link everything ---
      DD_SERVICE: shop-api
      DD_ENV: ${DD_ENV:-course}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      # --- where the agent is ---
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: 8126
      DD_DOGSTATSD_PORT: 8125
      # --- tracer options ---
      DD_LOGS_INJECTION: "true"         # trace_id/span_id in the MDC -> logs <-> traces
      DD_TRACE_SAMPLE_RATE: "1"         # keep 100 % of traces in the demo
      DD_PROFILING_ENABLED: "true"      # Continuous Profiler (day 4, developers)
      DD_DBM_PROPAGATION_MODE: full     # APM <-> DBM query correlation
      DD_TRACE_OTEL_ENABLED: "true"     # the app tags spans through the OpenTelemetry API
      DD_TRACE_DEBUG: "false"
    labels:
      com.datadoghq.tags.service: shop-api
      com.datadoghq.tags.env: ${DD_ENV:-course}
      com.datadoghq.tags.version: ${DD_VERSION:-1.0.0}
      # log source "java" picks the Java integration pipeline (stack traces are multi-line)
      com.datadoghq.ad.logs: '[{"source":"java","service":"shop-api"}]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  nginx:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: shop-web:${DD_VERSION:-1.0.0}
    container_name: nginx
    environment:
      DD_RUM_APP_ID: ${DD_RUM_APP_ID}
      DD_RUM_CLIENT_TOKEN: ${DD_RUM_CLIENT_TOKEN}
      DD_SITE: ${DD_SITE:-datadoghq.eu}
      DD_ENV: ${DD_ENV:-course}
      DD_VERSION: ${DD_VERSION:-1.0.0}
    labels:
      com.datadoghq.tags.service: shop-web
      com.datadoghq.tags.env: ${DD_ENV:-course}
      com.datadoghq.ad.logs: '[{"source":"nginx","service":"shop-web"}]'
    ports:
      - "8080:80"
    depends_on:
      - shop-api

  load:
    image: curlimages/curl:8.10.1
    container_name: load
    environment:
      TARGET: http://nginx
      PAUSE: "2"
    volumes:
      - ./load/generate.sh:/generate.sh:ro
    entrypoint: ["/bin/sh", "/generate.sh"]
    labels:
      com.datadoghq.tags.service: load
      com.datadoghq.tags.env: ${DD_ENV:-course}
    depends_on:
      - nginx

volumes:
  pgdata:
